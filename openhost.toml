[app]
name = "minio"
version = "0.1.0"
description = "MinIO S3-compatible object storage on OpenHost. The web console is gated by zone-owner SSO; the S3 API is exposed on a published host port and uses MinIO's native access-key auth (so any S3 client — aws-cli, rclone, mc, language SDKs — can talk to it without SSO)."

[runtime.container]
image = "Dockerfile"
# Container port 9090 is the auth-proxy sidecar.  It listens here
# and reverse-proxies the SSO-gated console traffic to MinIO's
# console upstream on 127.0.0.1:9001.  This is the port the
# OpenHost router routes browser traffic to (via the canonical
# subdomain form minio.<zone-domain>; path-prefixed
# <zone-domain>/minio/ also works but the dashboard links the
# subdomain).
#
# What the auth-proxy does: when an SSO-verified zone owner
# (X-OpenHost-Is-Owner: true, stamped by the OpenHost router on
# JWT-verified requests) hits the console without a MinIO session
# cookie yet, the proxy logs them in to MinIO automatically using
# the on-disk root credentials and 302s the browser back with the
# cookie set.  Subsequent requests carry the cookie and pass
# through normally.  This mirrors the openhost-plane.so pattern:
# trust the OpenHost router's owner-stamping and use it to mint
# an in-app session, so the operator only signs into OpenHost
# (never into MinIO directly).
#
# The upstream router's behaviour for non-owner requests still
# applies — visitors without zone_auth get 302'd to /login by the
# router before they ever reach our auth-proxy.
port = 9090

# S3 API on TCP/9000 inside the container.  Published to host port
# 9106 so external clients reach it as
# http://<zone-domain>:9106.  The zone's outer Caddy does NOT
# front this port — clients hit it directly without TLS by
# default.  See README "Connecting clients" for setup hints.
#
# Why 9106: matches the imbue-openhost convention of using
# port-range 9100+ for app-published TCP services (syncthing uses
# 9101/9102).  Any free 9100s host port would be fine.
[[ports]]
label = "s3-api"
container_port = 9000
host_port = 9106

[routing]
# Used by the OpenHost dashboard to decide if this app is
# "running."  The wait_for_ready probe just hits "/" and accepts
# any non-5xx response, but a more specific endpoint helps the
# dashboard distinguish "container up" from "MinIO actually ready
# to serve."
health_check = "/minio/health/live"
# Console is private — every console URL requires a valid
# zone_auth cookie.  The OpenHost router enforces this at its
# layer and 302-redirects unauthenticated browsers to /login on
# the parent zone domain.  After SSO completes, the same URL
# routes through correctly because the cookie is set with
# Domain=<zone-domain>, valid for both the canonical subdomain
# form (minio.<zone-domain>) and the path-prefix fallback
# (<zone-domain>/minio).
public_paths = []

[resources]
# MinIO's RSS at idle is ~80 MiB; under load with several parallel
# uploads a single instance hovers around 200-300 MiB.  The auth
# proxy sidecar adds ~30 MiB.  512 MiB gives comfortable headroom
# for occasional spikes during multipart upload bookkeeping.
memory_mb = 512
# MinIO is largely IO-bound.  500m is plenty for personal-scale
# backup workloads (one-or-two-clients-at-a-time push/pull).  Bump
# if this becomes a heavier-traffic instance.
cpu_millicores = 500

[data]
# Persistent: all object data, the MinIO root credentials, the
# server's configuration, and the IAM policies.  Lives under
# OPENHOST_APP_DATA_DIR/data and OPENHOST_APP_DATA_DIR/config.
app_data = true
