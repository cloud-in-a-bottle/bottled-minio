name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        engine: [docker, podman]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      CONTAINER_ENGINE: ${{ matrix.engine == 'podman' && 'pixi exec --spec podman~=5.8 --spec crun -- podman' || 'docker' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Pixi for the Cloud in a Bottle container runtime
        if: matrix.engine == 'podman'
        uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.70.2
          run-install: false
      - name: Allow the rootless Podman runtime
        if: matrix.engine == 'podman'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build from fresh base images
        run: $CONTAINER_ENGINE build --pull --no-cache --tag bottled-minio-ci .
      - name: Verify MinIO and client binaries
        run: |
          $CONTAINER_ENGINE run --rm --entrypoint /usr/bin/minio bottled-minio-ci --version
          $CONTAINER_ENGINE run --rm --entrypoint /usr/bin/mc bottled-minio-ci --version
